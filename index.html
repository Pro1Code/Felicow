<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felicow – Pide a delivery</title>
<style>
:root{--bg:#f6f1e3;--fg:#1d2a22;--cd:#fff;--mu:#5d6b62;--br:#e3dcc6;--ac:#1f5c3a;--ak:#fff;--wa:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a16;--fg:#eef2ea;--cd:#1e2721;--mu:#a3b0a7;--br:#2f3b33;--ac:#4cae78;--ak:#0b1a11;color-scheme:dark}}
:root[data-theme=dark]{--bg:#141a16;--fg:#eef2ea;--cd:#1e2721;--mu:#a3b0a7;--br:#2f3b33;--ac:#4cae78;--ak:#0b1a11;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:inherit;background:none}
input,select{font:inherit;width:100%;padding:12px;border:1px solid var(--br);border-radius:10px;background:var(--cd);color:var(--fg)}
.w{max-width:760px;margin:0 auto;padding:0 14px 110px}
.hero{background-size:cover;background-position:center;color:#fff;padding:90px 18px 22px;border-radius:0 0 22px 22px}
.hero h1{margin:0;font-size:38px}.hero p{margin:4px 0 12px;opacity:.9}
.pill{display:inline-block;background:var(--ac);color:var(--ak);padding:8px 14px;border-radius:999px;font-size:14px}
.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--bg)}
.chips button{flex:none;background:var(--cd);border:1px solid var(--br);padding:8px 14px;border-radius:999px;font-size:14px}
h2{margin:22px 0 4px;font-size:22px;scroll-margin-top:64px}.nt{margin:0 0 8px;color:var(--mu);font-size:14px}
.card{display:flex;gap:12px;background:var(--cd);border:1px solid var(--br);border-radius:16px;padding:12px;margin:10px 0}
.card img{width:104px;height:104px;object-fit:cover;border-radius:12px;flex:none}
.cb{flex:1;display:flex;flex-direction:column;min-width:0}.cb h3{margin:0 0 2px;font-size:17px}.cb p{margin:0 0 8px;color:var(--mu);font-size:14px}
.r{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.add,.pri{background:var(--ac);color:var(--ak);padding:10px 16px;font-weight:600}
.st{display:flex;align-items:center;gap:6px}.st button{width:36px;height:36px;background:var(--bg);border:1px solid var(--br);font-size:20px}.st i{min-width:22px;text-align:center;font-style:normal;font-weight:700}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;max-width:736px;margin:0 auto;display:flex;justify-content:space-between;padding:16px 18px;background:var(--ac);color:var(--ak);font-weight:700;font-size:17px;box-shadow:0 6px 24px #0005}
.ov{position:fixed;inset:0;background:#0009;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--br)}
.tot{font-size:20px;font-weight:700}label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mu)}
.pri{width:100%;margin-top:16px;padding:15px;font-size:17px}.sec{width:100%;margin-top:8px;padding:13px;border:1px solid var(--br)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.opts button{padding:12px 4px;border:2px solid var(--br);background:var(--cd);font-weight:600}.opts .on{border-color:var(--ac);background:var(--bg)}
.demo{background:#fff3cd;color:#664d03;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.err{color:var(--wa);font-size:14px;margin-top:10px}.ok{text-align:center;padding:10px 0}.ok>b{font-size:56px;display:block}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;padding:12px;border:2px solid var(--br);background:var(--cd);font-weight:700}.tabs .on{border-color:var(--ac)}
.ord{background:var(--cd);border:1px solid var(--br);border-radius:16px;padding:14px;margin:10px 0}.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--ac);color:var(--ak)}
.ed{display:grid;grid-template-columns:1fr 90px;gap:8px;background:var(--cd);border:1px solid var(--br);border-radius:14px;padding:12px;margin:8px 0}.ed .f{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.ed .dl{color:var(--wa);padding:8px}footer{text-align:center;color:var(--mu);font-size:13px;padding:26px 0}footer button{text-decoration:underline;color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
</style>
</head>

function qr(o){if(typeof qrcode!="function")return"";const igv=(o.total-o.total/1.18).toFixed(2),txt=[BZ.ruc,"03","B001",pad(o.id-1000,6),igv,o.total.toFixed(2),new Date(o.t).toISOString().slice(0,10),"1","00000000"].join("|")+"|";try{const q=qrcode(0,"M");q.addData(txt);q.make();return q.createSvgTag({cellSize:3,margin:0,scalable:true})}catch(e){return""}}
function bol(o){const g=o.total/1.18,dv=o.total-o.items.reduce((a,i)=>a+i.q*i.p,0);return`<div class="bol"><h3>${BZ.n}</h3><div class="c">RUC ${BZ.ruc} (demo)<br>${BZ.addr}</div><hr><div class="c"><b>BOLETA DE VENTA ELECTRÓNICA</b><br>${num(o)}</div><hr>Fecha: ${fd(o.t)} ${ft(o.t)}<br>Cliente: ${E(o.c.name)}<br>Entrega: ${E(o.c.addr)}<hr><table>${o.items.map(i=>`<tr><td>${i.q} × ${E(i.n)}<br><small>${$(i.p)} c/u</small></td><td class="t">${$(i.q*i.p)}</td></tr>`).join("")}<tr><td>Delivery</td><td class="t">${$(dv)}</td></tr></table><hr><table><tr><td>Op. gravada</td><td class="t">${$(g)}</td></tr><tr><td>IGV (18%)</td><td class="t">${$(o.total-g)}</td></tr><tr><td><b>TOTAL</b></td><td class="t"><b>${$(o.total)}</b></td></tr></table><hr>Pago: ${E(o.pay)}${qr(o)}<div class="c"><small>Representación impresa · Comprobante de DEMOSTRACIÓN, sin validez tributaria</small></div></div>`}
const bfile=o=>`<!DOCTYPE html><meta charset="utf-8"><title>${num(o)}</title><style>body{background:#eee;margin:0;padding:16px}${BCSS}</style>${bol(o)}`;
async function dl(n,d){try{const c=window.claude&&await claude.use("downloads");if(c){await c.save({filename:n,data:d});return}}catch(e){if(e&&e.code=="declined")return}const a=document.createElement("a");a.href=URL.createObjectURL(d);a.download=n;a.click()}
async function zip(l,n){if(!l.length){alert("No hay boletas en ese periodo");return}if(typeof JSZip=="undefined"){alert("No se pudo cargar el compresor .zip");return}const z=new JSZip(),sf=s=>'"'+String(s).replace(/^[-=+@]/,"'$&").replace(/"/g,'""')+'"';l.forEach(o=>z.file(num(o)+".html",bfile(o)));z.file("resumen.csv","boleta,fecha,hora,cliente,pago,total"+NL+l.map(o=>[num(o),fd(o.t),ft(o.t),sf(o.c.name),sf(o.pay),o.total.toFixed(2)].join(",")).join(NL));await dl(n,await z.generateAsync({type:"blob"}))}
const mini=o=>`<button class="mini" data-a="vb" data-id="${o.id}"><span><b>${num(o)}</b> · ${fd(o.t)} ${ft(o.t)}<br><small>${E(o.c.name)} · ${E(o.pay)}</small></span><b>${$(o.total)}</b></button>`;
function bolTab(){const g={};S.orders.slice().reverse().forEach(o=>(g[fd(o.t)]=g[fd(o.t)]||[]).push(o));return`<p class="nt">Descarga las boletas en un .zip (una boleta por archivo, más un resumen para Excel).</p><div class="opts"><button data-a="zip" data-v="1">⬇ Hoy</button><button data-a="zip" data-v="7">⬇ 7 días</button><button data-a="zip" data-v="30">⬇ 30 días</button></div>`+(S.orders.length?Object.entries(g).map(([d,l])=>`<h2 style="font-size:18px">${d} · ${l.length} boleta${l.length>1?"s":""} · ${$(l.reduce((a,o)=>a+o.total,0))}</h2>`+l.map(mini).join("")).join(""):`<p class="nt">Aún no hay boletas. Se generan solas cuando un cliente paga.</p>`)+`<div class="demo">Para que sean válidas ante SUNAT, la página se conecta a un facturador electrónico autorizado (OSE/PSE) con el RUC real del negocio. Esta versión es de demostración.</div>`}
function mlist(){const l=S.orders.filter(o=>S.mine.includes(o.id)).reverse();return`<div class="ov"><div class="sheet"><h2>Mis boletas</h2>${l.length?l.map(mini).join(""):`<p class="nt">Aún no tienes boletas.</p>`}<button class="sec" data-a="mx">Cerrar</button></div></div>`}
function bview(){return`<div class="ov"><div class="sheet">${bol(BV)}<button class="pri" style="margin-top:0" data-a="bdl" data-id="${BV.id}">Descargar boleta</button><button class="sec" data-a="bx">Cerrar</button></div></div>`}
let BV=null,ML=false,V="shop",adm=false,tab="ped",cart={},M=false,step=1,pm="yape",err="",busy=false,done=null,F={name:"",phone:"",addr:"",ref:"",note:"",yp:"",yc:"",cn:"",ce:"",cv:""};
const app=document.getElementById("app");
const sub=()=>Object.entries(cart).reduce((a,[id,q])=>a+q*S.menu.find(m=>m.id==id).p,0),cnt=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const card=m=>{const q=cart[m.id]||0;return`<article class="card"><div class="cb"><h3>${E(m.n)}</h3>${m.d?`<p>${E(m.d)}</p>`:""}<div class="r"><b>${$(m.p)}</b>${q?`<span class="st"><button data-a="dec" data-id="${m.id}">−</button><i>${q}</i><button data-a="inc" data-id="${m.id}">+</button></span>`:`<button class="add" data-a="inc" data-id="${m.id}">Agregar</button>`}</div></div>${IMG[m.im]?`<img src="${IMG[m.im]}" alt="${E(m.n)}">`:""}</article>`};
function shop(){return`<header class="hero" style="background-image:linear-gradient(#0006,#000c),url(${IMG.hero})"><h1>Felicow</h1><p>Cafetería y parrilla · Av. San Luis 1173, San Luis</p><span class="pill">Pide a delivery en 3 pasos</span>${S.mine.length?`<button class="pill" data-a="mine" style="margin-left:8px">🧾 Mis boletas</button>`:""}</header><nav class="chips">${CATS.map(([k,e,t])=>`<button data-a="go" data-k="${k}">${e} ${t}</button>`).join("")}</nav>${CATS.map(([k,e,t,n])=>{const it=S.menu.filter(m=>m.c==k&&m.on);return it.length?`<h2 id="s-${k}">${e} ${t}</h2>${n?`<p class="nt">${n}</p>`:""}${it.map(card).join("")}`:""}).join("")}<footer>Página de pedidos de demostración · <button data-a="admin">Soy el administrador</button></footer>`}
const bar=()=>cnt()&&!M?`<button class="bar" data-a="open"><span>🛒 Ver mi pedido (${cnt()})</span><span>${$(sub())}</span></button>`:"";
const inp=(l,f,ph,t)=>`<label>${l}</label><input data-f="${f}" value="${E(F[f])}" placeholder="${ph||""}" ${t?`inputmode="${t}"`:""}>`;
function modal(){let h="";
if(step==1)h=`<h2>Tu pedido</h2>${Object.keys(cart).map(id=>{const m=S.menu.find(x=>x.id==id);return`<div class="row"><span>${E(m.n)}<br><small>${$(m.p)}</small></span><span class="st"><button data-a="dec" data-id="${id}">−</button><i>${cart[id]}</i><button data-a="inc" data-id="${id}">+</button></span></div>`}).join("")}<div class="row"><span>Delivery</span><span>${$(S.fee)}</span></div><div class="row tot"><span>Total</span><span>${$(sub()+S.fee)}</span></div><button class="pri" data-a="next">Continuar</button><button class="sec" data-a="close">Seguir pidiendo</button>`;
else if(step==2)h=`<h2>¿A dónde lo llevamos?</h2>${inp("Tu nombre","name","Ej. María")}${inp("Celular","phone","9 dígitos","numeric")}${inp("Dirección","addr","Calle, número, distrito")}${inp("Referencia (opcional)","ref","Ej. frente al parque")}${inp("Notas del pedido (opcional)","note","Ej. papas fritas, ensalada fresca")}<div class="err">${E(err)}</div><button class="pri" data-a="next">Continuar al pago</button><button class="sec" data-a="back">Volver</button>`;
else if(step==3)h=`<h2>Elige cómo pagar</h2><div class="demo">🧪 Demostración: el pago es simulado, no se cobra nada.</div><div class="opts"><button data-a="pm" data-v="yape" class="${pm=="yape"?"on":""}">Yape</button><button data-a="pm" data-v="card" class="${pm=="card"?"on":""}">Tarjeta</button><button data-a="pm" data-v="cash" class="${pm=="cash"?"on":""}">Efectivo</button></div>${pm=="yape"?inp("Celular Yape","yp","9 dígitos","numeric")+inp("Código de aprobación (6 dígitos)","yc","000000","numeric")+`<p class="nt">En la app real, aquí se abre Yape para aprobar el pago.</p>`:pm=="card"?inp("Número de tarjeta (Visa, Mastercard, de cualquier banco)","cn","0000 0000 0000 0000","numeric")+`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div>${inp("Vence","ce","MM/AA")}</div><div>${inp("CVV","cv","123","numeric")}</div></div>`:`<p class="nt">Pagas en efectivo cuando llegue tu pedido.</p>`}<div class="err">${E(err)}</div><div class="row tot"><span>Total</span><span>${$(sub()+S.fee)}</span></div><button class="pri" data-a="pay" ${busy?"disabled":""}>${busy?"Procesando pago…":pm=="cash"?"Confirmar pedido":"Pagar "+$(sub()+S.fee)}</button>${busy?"":`<button class="sec" data-a="back">Volver</button>`}`;
else h=`<div class="ok"><b>✅</b><h2>¡Pedido recibido!</h2><p>Pedido <b>#${done.id}</b> · ${$(done.total)}<br>Pago: ${E(done.pay)}<br>Tiempo estimado: 35–45 min (demo)</p></div>${bol(done)}<button class="pri" style="margin-top:0" data-a="bdl" data-id="${done.id}">Descargar boleta</button><button class="sec" data-a="fin">Listo</button>`;
return`<div class="ov"><div class="sheet">${h}</div></div>`}
function login(){return`<div class="top"><h2 style="margin:0">Administrador</h2><button data-a="exit">← Volver a la carta</button></div><label>Usuario</label><input id="u" autocomplete="username"><label>Contraseña</label><input id="p" type="password" autocomplete="current-password"><div class="err">${E(err)}</div><button class="pri" data-a="login">Entrar</button><p class="nt">Demo: usuario <b>admin</b> · contraseña <b>felicow</b></p>`}
function panel(){const t=new Date;let h=`<div class="top"><h2 style="margin:0">Panel del administrador</h2><span><button data-a="exit">Ver carta</button> <button data-a="logout">Salir</button></span></div><div class="tabs"><button data-a="tab" data-v="ped" class="${tab=="ped"?"on":""}">📦 Pedidos (${S.orders.filter(o=>o.st<3).length})</button><button data-a="tab" data-v="menu" class="${tab=="menu"?"on":""}">🍽️ Carta y precios</button><button data-a="tab" data-v="bol" class="${tab=="bol"?"on":""}">🧾 Boletas</button></div>`;
if(tab=="ped"){h+=S.orders.length?S.orders.slice().reverse().map(o=>`<div class="ord"><div class="row" style="border:0"><b>#${o.id} · ${new Date(o.t).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"})}</b><span class="tag">${ST[o.st]}</span></div>${o.items.map(i=>`${i.q} × ${E(i.n)}`).join("<br>")}<p><b>${$(o.total)}</b> · ${E(o.pay)}<br>👤 ${E(o.c.name)} · 📞 ${E(o.c.phone)}<br>📍 ${E(o.c.addr)}${o.c.ref?` (${E(o.c.ref)})`:""}${o.c.note?`<br>📝 ${E(o.c.note)}`:""}</p>${o.st<3?`<button class="pri" style="margin:0" data-a="adv" data-id="${o.id}">${NX[o.st]}</button>`:""}</div>`).join("")+`<button class="sec" data-a="clr">Borrar pedidos de prueba</button>`:`<p class="nt">Todavía no hay pedidos. Haz uno desde la carta para verlo aquí.</p>`}
else if(tab=="bol"){h+=bolTab()}else{h+=`<label>Costo de delivery (S/)</label><input data-g="fee" value="${S.fee}" inputmode="decimal"><h2 style="font-size:18px">Agregar plato</h2><div class="ed"><input id="nn" placeholder="Nombre"><input id="np" placeholder="Precio" inputmode="decimal"><input id="nd" placeholder="Descripción (opcional)" style="grid-column:1/-1"><select id="nc" style="grid-column:1/-1">${CATS.map(c=>`<option value="${c[0]}">${c[2]}</option>`).join("")}</select><button class="pri" style="grid-column:1/-1;margin:0" data-a="add">Agregar a la carta</button></div><h2 style="font-size:18px">Platos actuales</h2><p class="nt">Cambia nombre o precio y se guarda solo. Apaga “Disponible” si se acabó.</p>`+S.menu.map(m=>`<div class="ed"><input data-id="${m.id}" data-f="n" value="${E(m.n)}"><input data-id="${m.id}" data-f="p" value="${m.p}" inputmode="decimal"><div class="f"><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" data-id="${m.id}" data-f="on" ${m.on?"checked":""}> Disponible · ${E((CATS.find(c=>c[0]==m.c)||[])[2])}</label><button class="dl" data-a="del" data-id="${m.id}">Eliminar</button></div></div>`).join("")}
return h}
function R(){const y=scrollY,o=document.querySelector(".sheet"),s=o?o.scrollTop:0;app.innerHTML=(V=="shop"?shop():adm?panel():login())+(V=="shop"?bar():"")+(M?modal():"")+(ML?mlist():"")+(BV?bview():"");document.body.style.overflow=M||ML||BV?"hidden":"";scrollTo(0,y);const n=document.querySelector(".sheet");if(n)n.scrollTop=s}
function chk(){const d=s=>String(s).replace(/\D/g,"");if(step==2){if(F.name.trim().length<2)return"Escribe tu nombre";if(d(F.phone).length!=9)return"El celular debe tener 9 dígitos";if(F.addr.trim().length<5)return"Escribe tu dirección"}
if(step==3){if(pm=="yape"&&(d(F.yp).length!=9||d(F.yc).length!=6))return"Revisa tu celular Yape (9 dígitos) y el código (6 dígitos)";if(pm=="card"){const n=d(F.cn).length;if(n<13||n>19)return"Revisa el número de tarjeta";if(!/^\d\d\/\d\d$/.test(F.ce.trim()))return"Vencimiento con formato MM/AA";if(!/^\d{3,4}$/.test(F.cv.trim()))return"Revisa el CVV"}}return""}
function mk(){const n=F.cn.replace(/\D/g,""),o={id:++S.seq,t:Date.now(),items:Object.entries(cart).map(([id,q])=>{const m=S.menu.find(x=>x.id==id);return{n:m.n,q,p:m.p}}),total:sub()+S.fee,pay:pm=="yape"?"Yape ···"+F.yp.slice(-3):pm=="card"?"Tarjeta ····"+n.slice(-4):"Efectivo (paga al recibir)",c:{name:F.name.trim(),phone:F.phone,addr:F.addr.trim(),ref:F.ref.trim(),note:F.note.trim()},st:0};S.orders.push(o);S.mine.push(o.id);save();cart={};return o}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=+b.dataset.id;
if(a=="inc")cart[id]=(cart[id]||0)+1;else if(a=="dec"){cart[id]=(cart[id]||0)-1;if(cart[id]<1)delete cart[id];if(M&&!cnt()){M=false}}
else if(a=="go"){document.getElementById("s-"+b.dataset.k)?.scrollIntoView({behavior:"smooth"});return}
else if(a=="open"){M=true;step=1;err=""}else if(a=="close")M=false;
else if(a=="next"){err=chk();if(!err)step++}else if(a=="back"){err="";step--}
else if(a=="pm"){pm=b.dataset.v;err=""}
else if(a=="pay"){err=chk();if(err)return R();busy=true;R();setTimeout(()=>{done=mk();busy=false;step=4;R()},1600);return}
else if(a=="fin"){M=false;done=null}
else if(a=="vb")BV=S.orders.find(o=>o.id==id)||null;else if(a=="bx")BV=null;else if(a=="mine")ML=true;else if(a=="mx")ML=false;
else if(a=="bdl"){const o=S.orders.find(x=>x.id==id);if(o)dl(num(o)+".html",new Blob([bfile(o)],{type:"text/html"}));return}
else if(a=="zip"){const d=+b.dataset.v,from=new Date().setHours(0,0,0,0)-(d-1)*864e5;zip(S.orders.filter(o=>o.t>=from),"boletas-"+({1:"dia",7:"semana",30:"mes"}[d])+"-"+new Date().toISOString().slice(0,10)+".zip");return}
else if(a=="admin"){V="admin";err="";scrollTo(0,0)}else if(a=="exit"){V="shop"}else if(a=="logout"){adm=false}
else if(a=="login"){if(document.getElementById("u").value.trim()=="admin"&&document.getElementById("p").value=="felicow"){adm=true;err=""}else err="Usuario o contraseña incorrectos"}
else if(a=="tab")tab=b.dataset.v;
else if(a=="adv"){const o=S.orders.find(x=>x.id==id);if(o&&o.st<3){o.st++;save()}}
else if(a=="clr"){if(confirm("¿Borrar todos los pedidos de prueba?")){S.orders=[];save()}}
else if(a=="del"){if(confirm("¿Eliminar este plato de la carta?")){S.menu=S.menu.filter(m=>m.id!=id);save()}}
else if(a=="add"){const n=document.getElementById("nn").value.trim(),p=parseFloat(document.getElementById("np").value.replace(",","."));if(!n||!(p>=0)){alert("Escribe el nombre y el precio del plato");return}S.menu.push({id:Math.max(0,...S.menu.map(m=>m.id))+1,c:document.getElementById("nc").value,n,d:document.getElementById("nd").value.trim(),p,im:"",on:1});save()}
R()});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.f&&!t.dataset.id)F[t.dataset.f]=t.value});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.g=="fee"){const v=parseFloat(t.value.replace(",","."));if(v>=0){S.fee=v;save()}return}
if(t.dataset.id&&t.dataset.f){const m=S.menu.find(x=>x.id==t.dataset.id),f=t.dataset.f;if(!m)return;if(f=="on")m.on=t.checked?1:0;else if(f=="p"){const v=parseFloat(t.value.replace(",","."));if(v>=0)m.p=v;else t.value=m.p}else if(t.value.trim())m.n=t.value.trim();save()}});
R();
</script>
